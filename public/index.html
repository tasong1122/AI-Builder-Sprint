<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#48e5fd">
    <title>lOV 돈 약속</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fff;
        color: #171717;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 420px);
        padding: 40px 28px;
        text-align: center;
        background: rgba(160, 234, 247, 0.22);
        border-radius: 34px;
      }
      h1 { margin: 0 0 12px; font-size: 28px; }
      p { margin: 0 0 28px; line-height: 1.6; color: #555; }
      a {
        display: block;
        padding: 16px 20px;
        border-radius: 34px;
        background: #48e5fd;
        color: #111;
        font-weight: 700;
        text-decoration: none;
      }
      #invalid { display: none; color: #b42318; }
    </style>
  </head>
  <body>
    <main>
      <h1>새로운 돈 약속이 도착했어요</h1>
      <p id="description">lOV 앱에서 친구가 보낸 돈 약속을 확인해 보세요.</p>
      <p id="invalid">올바르지 않은 돈 약속 링크입니다.</p>
      <a id="open-app" href="#">lOV 앱에서 확인하기</a>
    </main>
    <script>
      const pathMatch = location.pathname.match(/^\/contracts\/([A-Za-z0-9_-]{8,128})\/?$/);
      const queryId = new URLSearchParams(location.search).get('contract_id');
      const contractId = pathMatch?.[1] ?? queryId;
      const isValid = contractId && /^[A-Za-z0-9_-]{8,128}$/.test(contractId);
      const openButton = document.querySelector('#open-app');

      if (isValid) {
        openButton.href =
          `kakao1eeaa086fb4e3c76af6781a062923d75://kakaolink?contract_id=${encodeURIComponent(contractId)}`;
      } else {
        document.querySelector('#description').style.display = 'none';
        document.querySelector('#invalid').style.display = 'block';
        openButton.style.display = 'none';
      }
    </script>
  </body>
</html>
